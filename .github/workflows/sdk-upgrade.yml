name: Upgrade Expo SDK in isolated branch

on:
  push:
    branches: [fix/expo-sdk-security-2026-10]
    paths: ['.github/workflows/sdk-upgrade.yml']

permissions:
  contents: write

jobs:
  sdk-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Migrate Expo SDK one release at a time
        working-directory: mobile
        env:
          CI: "1"
        run: |
          set -euo pipefail
          npm ci
          for sdk in 53 54 55 56 57 58; do
            echo "::group::Upgrade Expo SDK ${sdk}"
            npm install "expo@^${sdk}.0.0" --no-audit --no-fund
            npx expo install --fix --npm
            echo "::endgroup::"
          done
      - name: Verify clean install and test
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run build:web
          npx expo-doctor@latest || true
          npm audit --json > /tmp/edzi-audit-after.json || true
          node -e "const a=require('/tmp/edzi-audit-after.json');console.log('AUDIT_TOTALS_AFTER',JSON.stringify(a.metadata?.vulnerabilities||{}));"
      - name: Commit upgraded Expo dependencies and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: migrate Expo SDK 52 to 58 with compatible dependencies"
            git push origin HEAD:fix/expo-sdk-security-2026-10
          fi
